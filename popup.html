<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Contribution Theme Customizer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
      padding: 0;
    }

    .container {
      background: white;
      border-radius: 8px;
      margin: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 18px;
      margin-bottom: 16px;
      color: #2c3e50;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section {
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #555;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .theme-btn {
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 13px;
      font-weight: 500;
    }

    .theme-btn:hover {
      border-color: #667eea;
      transform: translateY(-2px);
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
    }

    .theme-btn.active {
      border-color: #667eea;
      background: #f0f4ff;
      color: #667eea;
    }

    .preview {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-top: 6px;
    }

    .preview-cell {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      transition: transform 0.2s;
    }

    .preview-cell:hover {
      transform: scale(1.3);
    }

    .custom-colors {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .color-input-wrapper {
      position: relative;
    }

    .color-input {
      width: 100%;
      height: 40px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      cursor: pointer;
      padding: 0;
    }

    .color-input::-webkit-color-swatch-wrapper {
      padding: 4px;
    }

    .color-input::-webkit-color-swatch {
      border: none;
      border-radius: 4px;
    }

    .color-label {
      font-size: 10px;
      color: #888;
      text-align: center;
      margin-top: 4px;
    }

    .toggle-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toggle-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: #f8f9fa;
      border-radius: 6px;
    }

    .toggle-label {
      font-size: 13px;
      color: #555;
    }

    .toggle-switch {
      position: relative;
      width: 48px;
      height: 24px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.3s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #667eea;
    }

    input:checked + .slider:before {
      transform: translateX(24px);
    }

    .mode-selector {
      display: flex;
      gap: 8px;
    }

    .mode-btn {
      flex: 1;
      padding: 8px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }

    .mode-btn.active {
      border-color: #667eea;
      background: #667eea;
      color: white;
    }

    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    .btn {
      padding: 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #f8f9fa;
      color: #555;
      border: 2px solid #e0e0e0;
    }

    .btn-secondary:hover {
      background: #e9ecef;
    }

    .btn-capture {
      grid-column: 1 / -1;
      background: #28a745;
      color: white;
    }

    .btn-capture:hover {
      background: #218838;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(40, 167, 69, 0.4);
    }

    .status-message {
      text-align: center;
      padding: 8px;
      margin-top: 12px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }

    .status-message.success {
      background: #d4edda;
      color: #155724;
      display: block;
    }

    .status-message.error {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: #888;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #e0e0e0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 GitHub Theme Customizer</h1>

    <!-- Theme Presets -->
    <div class="section">
      <div class="section-title">🌈 Theme Presets</div>
      <div class="theme-grid">
        <button class="theme-btn" data-theme="classic">
          Classic
          <div class="preview">
            <span class="preview-cell" style="background: #ebedf0"></span>
            <span class="preview-cell" style="background: #9be9a8"></span>
            <span class="preview-cell" style="background: #40c463"></span>
            <span class="preview-cell" style="background: #30a14e"></span>
            <span class="preview-cell" style="background: #216e39"></span>
          </div>
        </button>
        <button class="theme-btn" data-theme="pastel">
          Pastel
          <div class="preview">
            <span class="preview-cell" style="background: #fef6f6"></span>
            <span class="preview-cell" style="background: #ffd4e5"></span>
            <span class="preview-cell" style="background: #ffb3d9"></span>
            <span class="preview-cell" style="background: #ff8cc6"></span>
            <span class="preview-cell" style="background: #ff69b4"></span>
          </div>
        </button>
        <button class="theme-btn" data-theme="midnight">
          Midnight
          <div class="preview">
            <span class="preview-cell" style="background: #1a1f2e"></span>
            <span class="preview-cell" style="background: #2d4059"></span>
            <span class="preview-cell" style="background: #ea5455"></span>
            <span class="preview-cell" style="background: #f07b3f"></span>
            <span class="preview-cell" style="background: #ffd460"></span>
          </div>
        </button>
        <button class="theme-btn" data-theme="neon">
          Neon
          <div class="preview">
            <span class="preview-cell" style="background: #0d0d0d"></span>
            <span class="preview-cell" style="background: #00ff41"></span>
            <span class="preview-cell" style="background: #00d9ff"></span>
            <span class="preview-cell" style="background: #ff00ff"></span>
            <span class="preview-cell" style="background: #ff0080"></span>
          </div>
        </button>
        <button class="theme-btn" data-theme="forest">
          Forest
          <div class="preview">
            <span class="preview-cell" style="background: #f0f4f0"></span>
            <span class="preview-cell" style="background: #a8d5ba"></span>
            <span class="preview-cell" style="background: #7fb69e"></span>
            <span class="preview-cell" style="background: #5a9b7d"></span>
            <span class="preview-cell" style="background: #2c5f4f"></span>
          </div>
        </button>
        <button class="theme-btn" data-theme="ocean">
          Ocean
          <div class="preview">
            <span class="preview-cell" style="background: #e6f3ff"></span>
            <span class="preview-cell" style="background: #99ccff"></span>
            <span class="preview-cell" style="background: #4da6ff"></span>
            <span class="preview-cell" style="background: #0080ff"></span>
            <span class="preview-cell" style="background: #0059b3"></span>
          </div>
        </button>
      </div>
    </div>

    <!-- Custom Colors -->
    <div class="section">
      <div class="section-title">🎨 Custom Colors</div>
      <div class="custom-colors">
        <div class="color-input-wrapper">
          <input type="color" class="color-input" id="color0" value="#ebedf0">
          <div class="color-label">Level 0</div>
        </div>
        <div class="color-input-wrapper">
          <input type="color" class="color-input" id="color1" value="#9be9a8">
          <div class="color-label">Level 1</div>
        </div>
        <div class="color-input-wrapper">
          <input type="color" class="color-input" id="color2" value="#40c463">
          <div class="color-label">Level 2</div>
        </div>
        <div class="color-input-wrapper">
          <input type="color" class="color-input" id="color3" value="#30a14e">
          <div class="color-label">Level 3</div>
        </div>
        <div class="color-input-wrapper">
          <input type="color" class="color-input" id="color4" value="#216e39">
          <div class="color-label">Level 4</div>
        </div>
      </div>
    </div>

    <!-- Mode Selection -->
    <div class="section">
      <div class="section-title">🌙 Display Mode</div>
      <div class="mode-selector">
        <button class="mode-btn" data-mode="auto">Auto</button>
        <button class="mode-btn" data-mode="light">Light</button>
        <button class="mode-btn" data-mode="dark">Dark</button>
      </div>
    </div>

    <!-- Features Toggle -->
    <div class="section">
      <div class="section-title">⚙️ Features</div>
      <div class="toggle-group">
        <div class="toggle-item">
          <span class="toggle-label">🎞️ Animations</span>
          <label class="toggle-switch">
            <input type="checkbox" id="toggle-animation" checked>
            <span class="slider"></span>
          </label>
        </div>
        <div class="toggle-item">
          <span class="toggle-label">📊 Analytics Overlay</span>
          <label class="toggle-switch">
            <input type="checkbox" id="toggle-overlay" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="action-buttons">
      <button class="btn btn-primary" id="btn-apply">✨ Apply Theme</button>
      <button class="btn btn-secondary" id="btn-reset">🔄 Reset</button>
      <button class="btn btn-capture" id="btn-capture">📸 Capture Screenshot</button>
    </div>

    <div class="status-message" id="status-message"></div>

    <div class="footer">
      v1.0.0 | Made with 💜 for GitHub lovers
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
